<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DotB EMS — Hỗ trợ khách hàng</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>%F0%9F%92%AC</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="topnav">
    <div class="brand">DotB EMS <small>Trợ lý hỗ trợ khách hàng</small></div>
    <nav>
      <a href="index.html" class="active">Chat</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main class="main">
    <div class="chat-page">
      <div class="thread" id="thread"></div>
      <form class="composer" id="composer">
        <textarea id="question" rows="1" placeholder="Nhập câu hỏi… (vd: bảo lưu học viên thì làm sao?)" autofocus></textarea>
        <button type="button" class="btn" id="handoffBtn" title="Chuyển cho nhân viên hỗ trợ">🧑‍💼 Nhân viên</button>
        <button type="submit" class="btn primary" id="sendBtn">Gửi</button>
      </form>
    </div>
  </main>
</div>
<script src="chat.js"></script>
</body>
</html>
